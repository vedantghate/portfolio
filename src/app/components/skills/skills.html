<section id="skills" class="py-12 max-w-6xl mx-auto px-4" aria-labelledby="skills-heading">
  
  <!-- Section Header (Left-aligned, bottom border, gradient text) -->
  <div class="mb-10 pb-6 border-b border-slate-800/60 w-full text-left">
    <h2 id="skills-heading" class="text-3xl md:text-4xl font-extrabold text-white">
      Technical <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-500">Skills</span>
    </h2>
  </div>

  <!-- Card Grid (Exactly matches the Experience section's 2-column layout and gap) -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
    
    @for (cat of skillCategories; track cat.category) {
      <div class="rounded-3xl bg-slate-900/40 backdrop-blur-md border border-slate-800 p-8 hover:border-indigo-500/50 hover:shadow-[0_0_30px_rgba(99,102,241,0.1)] transition-all">
        <h3 class="text-xs font-bold text-indigo-400 uppercase tracking-widest mb-6">{{ cat.category }}</h3>
        
        <!-- Skill Tags (Updated to match the Cyan glassmorphism from Experience) -->
        <div class="flex flex-wrap gap-2.5">
          @for (skill of cat.skills; track skill) {
            <span class="px-3 py-1.5 text-sm font-semibold text-cyan-300 bg-cyan-900/20 border border-cyan-800/30 rounded-lg">
              {{ skill }}
            </span>
          }
        </div>
      </div>
    }
    
  </div>
</section>
