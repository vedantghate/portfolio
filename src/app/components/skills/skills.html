<section id="skills" class="py-16 max-w-4xl mx-auto px-4" aria-labelledby="skills-heading">
  <h2 id="skills-heading" class="text-3xl font-extrabold text-slate-100 mb-8 border-b border-slate-800 pb-3">
    {{ 'SECTIONS.SKILLS' | translate }}
  </h2>
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    @for (cat of skillCategories; track cat.category) {
      <div class="bg-slate-900 border border-slate-800/80 p-5 rounded-lg">
        <h3 class="text-indigo-400 font-bold text-sm tracking-wide uppercase mb-3">{{ cat.category }}</h3>
        <div class="flex flex-wrap gap-2">
          @for (skill of cat.skills; track skill) {
            <span class="bg-slate-800 text-slate-200 text-xs font-mono px-3 py-1.5 rounded border border-slate-700">{{ skill }}</span>
          }
        </div>
      </div>
    }
  </div>
</section>
