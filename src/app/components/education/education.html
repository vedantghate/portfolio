<section id="education" class="py-12 max-w-6xl mx-auto px-4" aria-labelledby="education-heading">
  
  <!-- Section Header (Left-aligned, bottom border, matches grid width) -->
  <div class="mb-10 pb-6 border-b border-slate-800/60 w-full text-left">
    <h2 id="education-heading" class="text-3xl md:text-4xl font-extrabold text-white">
      Formal <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-500">Education</span>
    </h2>
  </div>

  <!-- Timeline Wrapper -->
  <div class="space-y-6">
    @for (edu of educationList; track edu.id) {
      <app-timeline-item [item]="edu" />
    }
  </div>
  
</section>
