<section id="experience" class="py-24 max-w-6xl mx-auto px-4">
  
  <!-- Section Header (Left-aligned, bottom border, gradient text) -->
  <div class="mb-10 pb-6 border-b border-slate-800/60 w-full text-left">
    <h2 class="text-3xl md:text-4xl font-extrabold text-white mb-3">
      Work <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-500">Experience</span>
    </h2>
    <p class="text-slate-400 text-sm md:text-base max-w-xl">
      Flip the card to explore detailed responsibilities, technical impact, and scale.
    </p>
  </div>

  <!-- Card Grid -->
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
    
    <div *ngFor="let exp of experiences; let i = index" 
         class="group h-[380px] perspective-1000 cursor-pointer"
         (click)="toggleFlip(i)">
      
      <!-- The 3D Rotating Container -->
      <div class="relative w-full h-full transition-transform duration-700 transform-style-3d"
           [class.rotate-y-180]="exp.isFlipped">
        
        <!-- ================= FRONT FACE ================= -->
        <div class="front-face absolute inset-0 w-full h-full backface-hidden rounded-3xl bg-slate-900/40 backdrop-blur-md border border-slate-800 p-8 flex flex-col justify-between hover:border-indigo-500/50 hover:shadow-[0_0_30px_rgba(99,102,241,0.1)]">
          
          <!-- Top: Company & Role -->
          <div>
            <div class="flex justify-between items-start mb-2">
              <h3 class="text-3xl font-extrabold text-white tracking-tight">{{ exp.company }}</h3>
              
              <div class="w-8 h-8 rounded-full bg-slate-800/50 flex items-center justify-center text-slate-400 group-hover:text-cyan-400 group-hover:bg-slate-800 transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
              </div>
            </div>
            <p class="text-indigo-400 font-semibold text-lg">{{ exp.role }}</p>
          </div>

          <!-- Middle: Location & Duration -->
          <div class="flex justify-between items-center text-slate-400 text-sm font-medium border-y border-slate-800/60 py-4 my-4">
            <span class="flex items-center gap-2">
              <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
              {{ exp.duration }}
            </span>
            <span class="flex items-center gap-2">
              <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.243-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
              {{ exp.location }}
            </span>
          </div>

          <!-- Bottom: Top Skills -->
          <div>
            <p class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-3">Top Skills Applied</p>
            <div class="flex flex-wrap gap-2">
              <span *ngFor="let skill of exp.skills" class="px-3 py-1.5 text-xs font-semibold text-cyan-300 bg-cyan-900/20 border border-cyan-800/30 rounded-lg">
                {{ skill }}
              </span>
            </div>
          </div>
        </div>

        <!-- ================= BACK FACE ================= -->
        <div class="back-face absolute inset-0 w-full h-full backface-hidden rotate-y-180 rounded-3xl bg-gradient-to-br from-slate-900 to-indigo-950/80 backdrop-blur-xl border border-indigo-500/40 p-8 flex flex-col shadow-[0_0_40px_rgba(99,102,241,0.15)]">
          
          <div class="flex justify-between items-center mb-6 pb-4 border-b border-indigo-500/20">
            <h4 class="text-xl font-bold text-white">Impact & Responsibilities</h4>
            <div class="w-8 h-8 rounded-full bg-indigo-500/20 flex items-center justify-center text-indigo-300 hover:bg-indigo-500/40 transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </div>
          </div>
          
          <div class="overflow-y-auto pr-2 custom-scrollbar flex-grow">
            <ul class="space-y-4">
              <li *ngFor="let detail of exp.details" class="text-slate-300 text-sm leading-relaxed flex items-start gap-3">
                <svg class="w-5 h-5 text-cyan-400 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span>{{ detail }}</span>
              </li>
            </ul>
          </div>
          
        </div>

      </div>
    </div>

  </div>
</section>
