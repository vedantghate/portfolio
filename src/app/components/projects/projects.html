<section id="projects" class="py-16 max-w-4xl mx-auto px-4" aria-labelledby="projects-heading">
  <h2 id="projects-heading" class="text-3xl font-extrabold text-slate-100 mb-8 border-b border-slate-800 pb-3">
    {{ 'SECTIONS.PROJECTS' | translate }}
  </h2>
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    @for (project of projects; track project.title) {
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 hover:border-indigo-500/50 transition-all duration-300 flex flex-col justify-between">
        <div>
          <h3 class="text-xl font-bold text-slate-100 mb-2">{{ project.title }}</h3>
          <p class="text-slate-300 text-sm mb-4 leading-relaxed">{{ project.description }}</p>
          @if (project.publication) {
            <p class="text-xs text-indigo-400 italic mb-4">{{ project.publication }}</p>
          }
        </div>
        <div>
          <div class="flex flex-wrap gap-2 mb-4">
            @for (tech of project.techStack; track tech) {
              <span class="text-xs font-mono bg-indigo-500/10 text-indigo-300 px-2.5 py-1 rounded">{{ tech }}</span>
            }
          </div>
          @if (project.link) {
            <a [href]="'https://' + project.link" target="_blank" rel="noopener noreferrer" class="inline-flex items-center text-xs font-semibold text-cyan-400 hover:text-cyan-300 transition-colors">
              Visit Live Demo
              <svg class="w-3.5 h-3.5 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
            </a>
          }
        </div>
      </div>
    }
  </div>
</section>
