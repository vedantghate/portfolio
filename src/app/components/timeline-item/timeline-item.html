<article class="group relative border-l-2 border-indigo-500/30 pl-6 pb-8 transition-all duration-300 hover:border-indigo-500" [attr.aria-labelledby]="'item-title-' + item.id">
  <div class="absolute -left-[9px] top-0 h-4 w-4 rounded-full bg-slate-900 border-2 border-indigo-500 transition-transform duration-300 group-hover:scale-125 group-hover:bg-indigo-500" aria-hidden="true"></div>
  
  <header class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-1">
    <h3 [id]="'item-title-' + item.id" class="text-xl font-bold text-slate-100 group-hover:text-indigo-400 transition-colors">
      {{ item.title }}
    </h3>
    <span class="text-sm font-medium text-indigo-400 bg-indigo-500/10 px-3 py-1 rounded-full w-fit">
      {{ item.period }}
    </span>
  </header>

  <div class="text-sm font-semibold text-slate-400 mt-1 mb-3 flex flex-wrap items-center gap-2">
    <span>{{ item.subtitle }}</span>
    <span aria-hidden="true">•</span>
    <span>{{ item.location }}</span>
  </div>

  <ul class="space-y-2 text-slate-300 text-sm leading-relaxed list-disc list-inside">
    @for (bullet of item.bullets; track $index) {
      <li class="transition-colors hover:text-slate-100">{{ bullet }}</li>
    }
  </ul>

  @if (item.tags && item.tags.length > 0) {
    <div class="flex flex-wrap gap-2 mt-4" aria-label="Technologies used">
      @for (tag of item.tags; track tag) {
        <span class="text-xs font-mono bg-slate-800 text-slate-300 px-2.5 py-1 rounded border border-slate-700">{{ tag }}</span>
      }
    </div>
  }
</article>
