<section id="leadership" class="py-12 max-w-6xl mx-auto px-4" aria-labelledby="leadership-heading">
    <!-- Section Header -->
    <div class="mb-10 pb-6 border-b border-slate-800/60">
        <h2 id="leadership-heading" class="text-3xl md:text-4xl font-extrabold text-white">
            Leadership
            <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-500">
                &amp; Impact
            </span>
        </h2>
    </div>

    <!-- Leadership Cards -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        @for (item of leadershipList; track item.id) {
        <article
            class="group relative flex flex-col h-full rounded-2xl border border-slate-800/80 bg-slate-900/40 p-6 backdrop-blur-sm transition-all duration-300 hover:-translate-y-1 hover:border-cyan-500/40 hover:bg-slate-900/70">
            <!-- Accent -->
            <div
                class="absolute left-0 top-6 bottom-6 w-1 rounded-r-full bg-gradient-to-b from-cyan-400 to-indigo-500 opacity-70 transition-opacity duration-300 group-hover:opacity-100">
            </div>

            <!-- Content -->
            <div class="pl-3">
                <div class="mb-2">
                    <h3 class="text-xl font-bold text-white transition-colors duration-300 group-hover:text-cyan-400">
                        {{ item.title }}
                    </h3>

                    <p class="mt-1 text-sm font-medium text-cyan-400/80">
                        {{ item.subtitle }}
                    </p>
                </div>

                <p class="mt-4 text-sm leading-7 text-slate-300">
                    {{ item.description }}
                </p>

                <!-- Tags -->
                <div class="mt-auto pt-6 flex flex-wrap gap-2">
                    @for (tag of item.tags; track tag) {
                    <span
                        class="rounded-full border border-slate-700 bg-slate-800/60 px-3 py-1 text-xs font-medium text-slate-300">
                        {{ tag }}
                    </span>
                    }
                </div>
            </div>
        </article>
        }
    </div>
</section>
